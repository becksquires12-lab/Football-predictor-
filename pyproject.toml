[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-predictor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "scipy>=1.12.0",
    "joblib>=1.3.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
football-predictor = "src.interface.cli:cli"

[tool.setuptools.packages.find]
include = ["src*", "config*"]
